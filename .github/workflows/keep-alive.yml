name: Keep-alive ping

on:
  schedule:
    # Every 5 minutes - keeps Render instance warm (Render sleeps after 15 min idle)
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render MCP endpoint
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL secret not set - skipping ping"
            exit 0
          fi
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" --max-time 30 "$RENDER_URL"
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
